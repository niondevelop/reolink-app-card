name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin

  build-test:
    name: Build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: dist/ matches src/
        run: |
          git diff --exit-code dist/ || { echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."; exit 1; }
      - run: node --check dist/reolink-app-card.js
      - name: Unit tests
        run: npm test
      # Systempakete kommen von den Ubuntu-Spiegeln; sind diese nicht erreichbar, reichen die Bibliotheken des Runners
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium || {
            echo "::warning::System packages for Chromium could not be installed (package mirror unreachable); using the runner's libraries"
            npx playwright install chromium
          }
      - name: Browser tests
        run: npm run test:browser

  # Nur bei Pull Requests: fertige Testdatei zum Ausprobieren in Home Assistant (siehe TESTING.de.md).
  # Läuft erst, wenn Build und Tests grün sind. Veröffentlicht und merged nichts.
  test-file:
    name: Test file for Home Assistant
    if: github.event_name == 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      # Genau der Stand des Pull Requests (nicht der Merge mit main), damit die Datei der im PR entspricht
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and compare with dist/ in the pull request
        run: |
          npm run build
          git diff --exit-code dist/ || { echo "::error::dist/ in this pull request is not built from src/. Run 'npm run build' and commit."; exit 1; }
      - name: File info
        id: info
        run: |
          echo "sha256=$(sha256sum dist/reolink-app-card.js | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "version=$(grep -oP "RAC_VERSION = [\"']\K[^\"']+" dist/reolink-app-card.js)" >> "$GITHUB_OUTPUT"
          echo "short=${SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Upload test file
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: reolink-app-card-pr-${{ github.event.pull_request.number }}
          path: dist/reolink-app-card.js
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Download notes
        id: notes
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          SHA256: ${{ steps.info.outputs.sha256 }}
          VERSION: ${{ steps.info.outputs.version }}
          SHORT: ${{ steps.info.outputs.short }}
        run: |
          RAW="https://raw.githubusercontent.com/$HEAD_REPO/$SHA/dist/reolink-app-card.js"
          {
            echo '<!-- reolink-app-card-test-file -->'
            echo "### 🧪 Test file for PR #$PR · version $VERSION · commit \`$SHORT\`"
            echo
            echo "Requires the card **0.2.0 or newer** from HACS / the Marketplace; your stable install stays untouched. Open **Terminal** in Home Assistant, paste and run (saves to \`/config/www/reolink-test/\` and checks the file; the last line must say **OK**):"
            echo
            echo '```bash'
            echo "D=\$( [ -d /homeassistant ] && echo /homeassistant || echo /config )/www/reolink-test; mkdir -p \$D && curl -fsSL -o \$D/reolink-app-card.js $RAW && echo \"$SHA256  \$D/reolink-app-card.js\" | sha256sum -c"
            echo '```'
            echo
            echo "Then open the dashboard with \`?rac_channel=test\` at the end of the address (once per device, admins only). A purple **Test version** bar shows in the card. Guide: [English](https://github.com/$HEAD_REPO/blob/$SHA/TESTING.md) · [Deutsch](https://github.com/$HEAD_REPO/blob/$SHA/TESTING.de.md)"
            echo
            echo "- Or download: [artifact \`reolink-app-card-pr-$PR\`]($ARTIFACT_URL) (zip, GitHub login, 30 days) · [file directly]($RAW)"
            echo "- SHA-256: \`$SHA256\` – identical to \`dist/reolink-app-card.js\` in this commit"
            echo "- Back to the stable version: tap the purple bar in the card, then **Go back** (or open the dashboard with \`?rac_channel=stable\`)"
          } > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      # Kommentar im PR (wird bei jedem neuen Commit aktualisiert); bei PRs aus Forks fehlt die Berechtigung
      - name: Comment on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('notes.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const old = comments.find((c) => c.user.type === 'Bot' && c.body.includes('<!-- reolink-app-card-test-file -->'));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
