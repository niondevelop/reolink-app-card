name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version in code
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(grep -oP "RAC_VERSION = [\"']\K[^\"']+" dist/reolink-app-card.js)
          if [ "$TAG" != "$CODE" ]; then
            echo "Tag v$TAG does not match RAC_VERSION $CODE"; exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/reolink-app-card.js
          generate_release_notes: true
